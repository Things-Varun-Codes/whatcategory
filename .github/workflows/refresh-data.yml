name: Refresh data

# Weekly: update the upstream open data, rebuild, and open a pull request showing how the
# evaluation results changed. Dependabot leaves these packages alone for that reason.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Credentials are kept: this job pushes the refresh branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Update upstream data
        run: |
          npm install --save-exact --save-dev name-suggestion-index@latest @openstreetmap/id-tagging-schema@latest cldr-annotations-full@latest cldr-core@latest
          curl -fsSL https://unicode.org/Public/emoji/latest/emoji-test.txt -o upstream/emoji-test.txt
      - run: npm run build:data
      - run: npm run build
      - run: npm test
      - run: npm run eval
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No upstream changes."; exit 0; fi
          branch="data-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(data): refresh upstream data"
          git push -u origin "$branch"
          { echo "Automated refresh of the upstream open data. Tests passed in the refresh run."; echo; echo "## How the results changed"; echo; echo '```diff'; git diff HEAD~1 -- eval/RESULTS.md | head -200; echo '```'; } > body.md
          gh pr create --title "chore(data): refresh upstream data $(date -u +%Y-%m-%d)" --body-file body.md
          gh workflow run ci.yml --ref "$branch"

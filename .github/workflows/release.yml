name: Release

# Stages the package on npm when a GitHub release is published, after the same checks as CI.
# Uses npm trusted publishing: npm checks this workflow's identity, so no npm token is stored.
# The trusted publisher may only stage, so a maintainer approves the version with two-factor
# authentication before it goes live (RELEASE.md).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: The release tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      # `npm stage` needs npm 12; Node 22 ships npm 10.
      - run: npm install --global npm@12.2.3
      - run: npm ci
      # prepack rebuilds data and dist from the same pinned inputs CI just tested.
      - run: npm stage publish --access public --provenance
